services:
  sub2api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sub2api
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      - sub2api_data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - RUN_MODE=standard

volumes:
  sub2api_data:
    driver: local